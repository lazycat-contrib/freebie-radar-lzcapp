manifest: ./lzc-manifest.yml
pkgout: ./
icon: ./icon.png
# 源码构建：上游 freebie-radar 未发布 docker 镜像，构建时内嵌上游源码快照。
# build/source.tar.gz 为上游 main 分支 git archive 快照（记录 SHA 于 build/SOURCE_SHA）。
# 说明：不在容器内 git clone —— 盒子构建网络不保证可达 github.com。
images:
  radar:
    dockerfile-content: |
      FROM node:24-alpine AS src
      WORKDIR /appsrc
      ADD source.tar.gz .
      RUN sh -c 'cd ZiChuanLan-freebie-radar-* && mv * .[!.]* .. 2>/dev/null; cd .. && rmdir ZiChuanLan-freebie-radar-*'

      FROM node:24-alpine AS build
      WORKDIR /app
      COPY --from=src /appsrc .
      RUN npm i -g pnpm@10 && pnpm install --frozen-lockfile
      RUN pnpm build

      FROM node:24-alpine AS runtime
      WORKDIR /app
      ENV NODE_ENV=production
      ENV NODE_OPTIONS="--max-old-space-size=192"
      # curl + ca-certificates：部分源的 Cloudflare 对 Node undici TLS 指纹返回 403
      RUN apk add --no-cache curl ca-certificates
      COPY --from=src /appsrc/package.json /appsrc/pnpm-lock.yaml ./
      RUN npm i -g pnpm@10 \
          && pnpm install --frozen-lockfile --prod \
          && npm uninstall -g pnpm \
          && rm -rf /root/.local/share/pnpm /root/.npm /tmp/*
      COPY --from=build /app/dist ./dist
      COPY --from=src /appsrc/src/server ./src/server
      COPY --from=src /appsrc/src/shared ./src/shared
      COPY --from=src /appsrc/tsconfig.json ./
      RUN mkdir -p /data
      EXPOSE 8788
      VOLUME ["/data"]
      HEALTHCHECK --interval=30s --timeout=5s --start-period=10s --retries=3 \
        CMD node -e "fetch('http://127.0.0.1:8788/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      CMD ["node", "--no-warnings", "src/server/index.ts"]
    context: build
